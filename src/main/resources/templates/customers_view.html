<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Customers</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            margin: 0;
            padding: 24px;
            color: #222;
        }
        .card {
            max-width: 960px;
            margin: 0 auto;
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 6px;
            padding: 24px;
        }
        h1 {
            margin-top: 0;
            font-size: 20px;
            border-bottom: 1px solid #eee;
            padding-bottom: 12px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            overflow-wrap: anywhere;
            text-align: left;
            padding: 8px 8px;
            border-bottom: 1px solid #f0f0f0;
            font-size: 14px;
            vertical-align: top;
        }
        thead th {
            color: #666;
            font-weight: normal;
            background: #fafafa;
        }
        tbody tr:hover {
            background: #fbfbfb;
        }
        .mono {
            font-family: monospace;
            color: #555;
        }
        .muted {
            color: #999;
        }
        .pagination {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            font-size: 14px;
        }
        .pagination a {
            text-decoration: none;
            color: #0b5aa2;
            padding: 6px 12px;
            border-radius: 4px;
            border: 1px solid #d0dcee;
        }
        .pagination a:hover {
            background: #eef4ff;
        }
        .pagination .disabled {
            color: #bbb;
            padding: 6px 12px;
            border: 1px solid #eee;
            border-radius: 4px;
        }
        .pagination .info {
            color: #666;
        }
    </style>
    <th:block th:replace="~{fragments/nav :: styles}"></th:block>
</head>
<body>
<div class="card">
    <div th:replace="~{fragments/nav :: bar(null)}"></div>
    <h1>Customers</h1>

    <table>
        <thead>
        <tr>
            <th>Customer ID</th>
            <th>Unique ID</th>
            <th>City</th>
            <th>State</th>
            <th>ZIP prefix</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="customer : ${customers.content}">
            <td class="mono" th:text="${customer.customerId}">-</td>
            <td class="mono" th:text="${customer.customerUniqueId}">-</td>
            <td th:text="${customer.customerCity}">-</td>
            <td th:text="${customer.customerState}">-</td>
            <td th:text="${customer.customerZipCodePrefix}">-</td>
        </tr>
        <tr th:if="${customers.empty}">
            <td colspan="5" class="muted" style="text-align: center;">No customers on this page.</td>
        </tr>
        </tbody>
    </table>

    <div class="pagination">
        <a th:if="${customers.hasPrevious()}" th:href="@{/customers(page=${customers.number - 1})}">← Prev</a>
        <span th:unless="${customers.hasPrevious()}" class="disabled">← Prev</span>

        <span class="info" th:text="'Page ' + ${customers.number + 1} + ' / ' + ${customers.totalPages}">Page 1</span>

        <a th:if="${customers.hasNext()}" th:href="@{/customers(page=${customers.number + 1})}">Next →</a>
        <span th:unless="${customers.hasNext()}" class="disabled">Next →</span>
    </div>
</div>
</body>
</html>
