<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Products</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            margin: 0;
            padding: 24px;
            color: #222;
        }
        .card {
            max-width: 960px;
            margin: 0 auto;
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 6px;
            padding: 24px;
        }
        h1 {
            margin-top: 0;
            font-size: 20px;
            border-bottom: 1px solid #eee;
            padding-bottom: 12px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            text-align: left;
            padding: 8px 8px;
            border-bottom: 1px solid #f0f0f0;
            font-size: 14px;
            vertical-align: top;
        }
        thead th {
            color: #666;
            font-weight: normal;
            background: #fafafa;
        }
        tbody tr:hover {
            background: #fbfbfb;
        }
        .mono {
            font-family: monospace;
            color: #555;
        }
        .muted {
            color: #999;
        }
        td.num {
            text-align: right;
            font-variant-numeric: tabular-nums;
        }
        .pagination {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            font-size: 14px;
        }
        .pagination a {
            text-decoration: none;
            color: #0b5aa2;
            padding: 6px 12px;
            border-radius: 4px;
            border: 1px solid #d0dcee;
        }
        .pagination a:hover {
            background: #eef4ff;
        }
        .pagination .disabled {
            color: #bbb;
            padding: 6px 12px;
            border: 1px solid #eee;
            border-radius: 4px;
        }
        .pagination .info {
            color: #666;
        }
    </style>
</head>
<body>
<div class="card">
    <h1>Products</h1>

    <table>
        <thead>
        <tr>
            <th>Product ID</th>
            <th>Category</th>
            <th>Weight (g)</th>
            <th>Dimensions (L×W×H cm)</th>
            <th>Photos</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="product : ${products.content}">
            <td class="mono" th:text="${product.productId}">-</td>
            <td>
                <span th:if="${product.productCategoryName}"
                      th:text="${product.productCategoryName.productCategoryName}">-</span>
                <span th:unless="${product.productCategoryName}" class="muted">—</span>
            </td>
            <td class="num">
                <span th:if="${product.productWeightG != null}" th:text="${product.productWeightG}">-</span>
                <span th:unless="${product.productWeightG != null}" class="muted">—</span>
            </td>
            <td class="num">
                <span th:if="${product.productLengthCm != null and product.productWidthCm != null and product.productHeightCm != null}"
                      th:text="${product.productLengthCm} + '×' + ${product.productWidthCm} + '×' + ${product.productHeightCm}">-</span>
                <span th:unless="${product.productLengthCm != null and product.productWidthCm != null and product.productHeightCm != null}"
                      class="muted">—</span>
            </td>
            <td class="num">
                <span th:if="${product.productPhotosQty != null}" th:text="${product.productPhotosQty}">-</span>
                <span th:unless="${product.productPhotosQty != null}" class="muted">—</span>
            </td>
        </tr>
        <tr th:if="${products.empty}">
            <td colspan="5" class="muted" style="text-align: center;">No products on this page.</td>
        </tr>
        </tbody>
    </table>

    <div class="pagination">
        <a th:if="${products.hasPrevious()}" th:href="@{/products(page=${products.number - 1})}">← Prev</a>
        <span th:unless="${products.hasPrevious()}" class="disabled">← Prev</span>

        <span class="info" th:text="'Page ' + ${products.number + 1} + ' / ' + ${products.totalPages}">Page 1</span>

        <a th:if="${products.hasNext()}" th:href="@{/products(page=${products.number + 1})}">Next →</a>
        <span th:unless="${products.hasNext()}" class="disabled">Next →</span>
    </div>
</div>
</body>
</html>
