<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<style th:fragment="styles">
    body {
        font-family: Arial, sans-serif;
        background: #f5f5f5;
        margin: 0;
        padding: 24px;
        color: #222;
    }
    .card {
        max-width: 480px;
        margin: 0 auto;
        background: #fff;
        border: 1px solid #ddd;
        border-radius: 6px;
        padding: 24px;
    }
    h1 {
        margin-top: 0;
        font-size: 20px;
        border-bottom: 1px solid #eee;
        padding-bottom: 12px;
    }
    .field {
        margin-bottom: 14px;
    }
    .field label {
        display: block;
        font-size: 12px;
        color: #666;
        margin-bottom: 4px;
    }
    .field input {
        width: 100%;
        padding: 6px 8px;
        border: 1px solid #ccc;
        border-radius: 4px;
        font-size: 14px;
        font-family: inherit;
        box-sizing: border-box;
    }
    .field input:disabled {
        background: #f5f5f5;
        color: #666;
    }
    .field input.input-error {
        border-color: #a32020;
        background: #fff8f8;
    }
    .field-error {
        display: block;
        color: #a32020;
        font-size: 13px;
        margin-top: 4px;
    }
    .actions {
        display: flex;
        justify-content: flex-end;
        align-items: center;
        gap: 8px;
        margin-top: 20px;
    }
    .actions button {
        padding: 6px 14px;
        border-radius: 4px;
        font-size: 14px;
        font-family: inherit;
        cursor: pointer;
        background: #eef4ff;
        color: #0b5aa2;
        border: 1px solid #d0dcee;
    }
    .actions button:hover {
        background: #dbe8fb;
    }
    .actions a {
        padding: 6px 14px;
        border-radius: 4px;
        font-size: 14px;
        text-decoration: none;
        background: #fff;
        border: 1px solid #ddd;
        color: #555;
    }
    .actions a:hover {
        background: #f5f5f5;
    }
</style>

</body>
</html>
