<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title th:text="'Order ' + ${order.orderId}">Order</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            margin: 0;
            padding: 24px;
            color: #222;
        }
        .card {
            max-width: 640px;
            margin: 0 auto;
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 6px;
            padding: 24px;
        }
        h1 {
            margin-top: 0;
            font-size: 20px;
            border-bottom: 1px solid #eee;
            padding-bottom: 12px;
        }
        h2 {
            font-size: 16px;
            margin-top: 24px;
            margin-bottom: 8px;
            color: #555;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            text-align: left;
            padding: 8px 4px;
            border-bottom: 1px solid #f0f0f0;
            font-size: 14px;
            vertical-align: top;
        }
        th {
            width: 40%;
            color: #666;
            font-weight: normal;
        }
        .muted {
            color: #999;
        }
        .review {
            border: 1px solid #eee;
            border-radius: 4px;
            padding: 12px;
            margin-bottom: 10px;
        }
        .review-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 6px;
            font-size: 14px;
        }
        .score {
            font-weight: bold;
            color: #a67c00;
        }
        .review-title {
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 4px;
        }
        .review-message {
            font-size: 14px;
            margin-bottom: 6px;
        }
        .review-meta {
            font-size: 12px;
        }
    </style>
    <th:block th:replace="~{fragments/status :: styles}"></th:block>
</head>
<body>
<div class="card">
    <h1>Order <span th:text="${order.orderId}">-</span></h1>

    <table>
        <tr>
            <th>Status</th>
            <td><span th:replace="~{fragments/status :: badge(${order.orderStatus})}">STATUS</span></td>
        </tr>
        <tr>
            <th>Purchased at</th>
            <td th:text="${order.orderPurchaseTimestamp}">-</td>
        </tr>
        <tr>
            <th>Approved at</th>
            <td>
                <span th:if="${order.orderApprovedAt}" th:text="${order.orderApprovedAt}">-</span>
                <span th:unless="${order.orderApprovedAt}" class="muted">—</span>
            </td>
        </tr>
        <tr>
            <th>Delivered to carrier</th>
            <td>
                <span th:if="${order.orderDeliveredCarrierDate}" th:text="${order.orderDeliveredCarrierDate}">-</span>
                <span th:unless="${order.orderDeliveredCarrierDate}" class="muted">—</span>
            </td>
        </tr>
        <tr>
            <th>Delivered to customer</th>
            <td>
                <span th:if="${order.orderDeliveredCustomerDate}" th:text="${order.orderDeliveredCustomerDate}">-</span>
                <span th:unless="${order.orderDeliveredCustomerDate}" class="muted">—</span>
            </td>
        </tr>
        <tr>
            <th>Estimated delivery</th>
            <td th:text="${order.orderEstimatedDeliveryDate}">-</td>
        </tr>
    </table>

    <h2>Customer</h2>
    <table>
        <tr>
            <th>ID</th>
            <td th:text="${order.customer.customerId}">-</td>
        </tr>
        <tr>
            <th>Unique ID</th>
            <td th:text="${order.customer.customerUniqueId}">-</td>
        </tr>
        <tr>
            <th>City</th>
            <td th:text="${order.customer.customerCity}">-</td>
        </tr>
        <tr>
            <th>State</th>
            <td th:text="${order.customer.customerState}">-</td>
        </tr>
        <tr>
            <th>ZIP prefix</th>
            <td th:text="${order.customer.customerZipCodePrefix}">-</td>
        </tr>
    </table>

    <h2>Reviews</h2>
    <p th:if="${#lists.isEmpty(reviews)}" class="muted">No reviews yet.</p>
    <div th:each="review : ${reviews}" class="review">
        <div class="review-header">
            <span class="score" th:text="'★ ' + ${review.reviewScore} + ' / 5'">★ - / 5</span>
        </div>
        <div class="review-title"
             th:if="${review.reviewCommentTitle != null and !#strings.isEmpty(review.reviewCommentTitle)}"
             th:text="${review.reviewCommentTitle}">-</div>
        <div class="review-message"
             th:if="${review.reviewCommentMessage != null and !#strings.isEmpty(review.reviewCommentMessage)}"
             th:text="${review.reviewCommentMessage}">-</div>
        <div class="review-meta muted">
            Answered at <span th:text="${review.reviewAnswerTimestamp}">-</span>
        </div>
    </div>
</div>
</body>
</html>
