<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Audit</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            margin: 0;
            padding: 24px;
            color: #222;
        }
        .card {
            max-width: 1080px;
            margin: 0 auto;
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 6px;
            padding: 24px;
        }
        h1 {
            margin-top: 0;
            font-size: 20px;
            border-bottom: 1px solid #eee;
            padding-bottom: 12px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            text-align: left;
            padding: 8px 8px;
            border-bottom: 1px solid #f0f0f0;
            font-size: 14px;
            vertical-align: top;
        }
        thead th {
            color: #666;
            font-weight: normal;
            background: #fafafa;
        }
        tbody tr:hover {
            background: #fbfbfb;
        }
        .mono {
            font-family: monospace;
            color: #555;
        }
        .muted {
            color: #999;
        }
        .nowrap {
            white-space: nowrap;
        }
        .tag {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 3px;
            background: #eef4ff;
            color: #0b5aa2;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 0.3px;
        }
        .filters {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 12px 16px;
            margin-bottom: 20px;
            align-items: end;
        }
        .filters label {
            display: block;
            font-size: 12px;
            color: #666;
            margin-bottom: 4px;
        }
        .filters input,
        .filters select {
            width: 100%;
            padding: 6px 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
            font-family: inherit;
            box-sizing: border-box;
            background: #fff;
        }
        .filters .actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .filters button {
            padding: 6px 14px;
            border: 1px solid #d0dcee;
            border-radius: 4px;
            background: #eef4ff;
            color: #0b5aa2;
            font-size: 14px;
            font-family: inherit;
            cursor: pointer;
        }
        .filters button:hover {
            background: #dbe8fb;
        }
        .filters a.reset {
            padding: 6px 14px;
            border: 1px solid #ddd;
            border-radius: 4px;
            background: #fff;
            color: #555;
            font-size: 14px;
            text-decoration: none;
        }
        .filters a.reset:hover {
            background: #f5f5f5;
        }
        .pagination {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            font-size: 14px;
        }
        .pagination a {
            text-decoration: none;
            color: #0b5aa2;
            padding: 6px 12px;
            border-radius: 4px;
            border: 1px solid #d0dcee;
        }
        .pagination a:hover {
            background: #eef4ff;
        }
        .pagination .disabled {
            color: #bbb;
            padding: 6px 12px;
            border: 1px solid #eee;
            border-radius: 4px;
        }
        .pagination .info {
            color: #666;
        }
    </style>
</head>
<body>
<div class="card">
    <h1>Audit</h1>

    <form class="filters" method="get" th:action="@{/audit}" th:object="${auditFilter}">
        <div>
            <label for="entityType">Entity</label>
            <select id="entityType" th:field="*{entityType}">
                <option value="" th:value="''">Any</option>
                <option th:each="e : ${dbEntities}" th:value="${e}" th:text="${e}"></option>
            </select>
        </div>
        <div class="actions">
            <button type="submit">Apply</button>
            <a class="reset" th:href="@{/audit}">Reset</a>
        </div>
    </form>

    <table>
        <thead>
        <tr>
            <th class="nowrap">Changed at</th>
            <th>Entity</th>
            <th>Entity ID</th>
            <th>Field</th>
            <th>Old value</th>
            <th>New value</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="row : ${audit.content}">
            <td class="nowrap" th:text="${row.changedAt}">-</td>
            <td><span class="tag" th:text="${row.entityType}">-</span></td>
            <td class="mono" th:text="${row.entityId}">-</td>
            <td class="mono" th:text="${row.field}">-</td>
            <td th:text="${row.oldValue}">-</td>
            <td th:text="${row.newValue}">-</td>
        </tr>
        <tr th:if="${audit.empty}">
            <td colspan="6" class="muted" style="text-align: center;">No audit records match the current filter.</td>
        </tr>
        </tbody>
    </table>

    <div class="pagination">
        <a th:if="${audit.hasPrevious()}"
           th:href="@{/audit(page=${audit.number - 1}, entityType=${auditFilter.entityType})}">← Prev</a>
        <span th:unless="${audit.hasPrevious()}" class="disabled">← Prev</span>

        <span class="info" th:text="'Page ' + ${audit.number + 1} + ' / ' + ${audit.totalPages}">Page 1</span>

        <a th:if="${audit.hasNext()}"
           th:href="@{/audit(page=${audit.number + 1}, entityType=${auditFilter.entityType})}">Next →</a>
        <span th:unless="${audit.hasNext()}" class="disabled">Next →</span>
    </div>
</div>
</body>
</html>
