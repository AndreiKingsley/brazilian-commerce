<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Geo report</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            margin: 0;
            padding: 24px;
            color: #222;
        }
        .card {
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 6px;
            padding: 24px;
        }
        h1 {
            margin-top: 0;
            font-size: 20px;
            border-bottom: 1px solid #eee;
            padding-bottom: 12px;
        }
        h2 {
            font-size: 15px;
            font-weight: normal;
            color: #666;
            margin: 28px 0 8px;
        }
        .chart {
            display: block;
            width: 100%;
            height: 560px;
            border: 1px solid #eee;
            border-radius: 4px;
            background: #fff;
        }
        /* 27 states do not fit the card, so the matrix scrolls sideways */
        .matrix-wrap {
            overflow-x: auto;
            border: 1px solid #eee;
            border-radius: 4px;
        }
        table {
            border-collapse: collapse;
            width: auto;
            min-width: 100%;
        }
        th, td {
            text-align: left;
            padding: 8px 8px;
            border-bottom: 1px solid #f0f0f0;
            font-size: 14px;
        }
        thead th {
            color: #666;
            font-weight: normal;
            background: #fafafa;
        }
        .col-month {
            width: 140px;
            white-space: nowrap;
        }
        .num {
            text-align: right;
            font-family: monospace;
            font-size: 13px;
            white-space: nowrap;
        }
        .muted {
            color: #999;
        }
    </style>
    <th:block th:replace="~{fragments/nav :: styles}"></th:block>
</head>
<body>
<div class="card" th:with="matrix=${report.matrix}">
    <div th:replace="~{fragments/nav :: bar(null)}"></div>
    <h1>Geo report</h1>

    <h2>Revenue by month and state</h2>
    <!-- The plot is a whole HTML document with its own scripts, so it lives in an iframe.
         srcdoc keeps both in this response: no extra requests, geoReport() runs once per page view. -->
    <iframe class="chart"
            title="Revenue by month and state"
            th:attr="srcdoc=${report.plotGeoHeatmapHtml}"></iframe>

    <h2>Revenue matrix</h2>
    <div class="matrix-wrap">
        <table>
            <thead>
            <tr>
                <th class="col-month">Month</th>
                <th class="num" th:each="state : ${matrix.states}" th:text="${state}">-</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="row, it : ${matrix.revenue}">
                <td class="col-month" th:text="${matrix.months[it.index]}">-</td>
                <td class="num" th:each="cell : ${row}"
                    th:text="${#numbers.formatDecimal(cell, 1, 'COMMA', 2, 'POINT')}">-
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(matrix.revenue)}">
                <td class="muted" style="text-align: center;"
                    th:attr="colspan=${#lists.size(matrix.states) + 1}">No geo data.
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
