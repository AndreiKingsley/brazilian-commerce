<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Orders</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            margin: 0;
            padding: 24px;
            color: #222;
        }
        .card {
            max-width: 960px;
            margin: 0 auto;
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 6px;
            padding: 24px;
        }
        h1 {
            margin-top: 0;
            font-size: 20px;
            border-bottom: 1px solid #eee;
            padding-bottom: 12px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            text-align: left;
            padding: 8px 8px;
            border-bottom: 1px solid #f0f0f0;
            font-size: 14px;
            vertical-align: top;
        }
        thead th {
            color: #666;
            font-weight: normal;
            background: #fafafa;
        }
        tbody tr:hover {
            background: #fbfbfb;
        }
        a.order-link {
            color: #0b5aa2;
            text-decoration: none;
            font-family: monospace;
        }
        a.order-link:hover {
            text-decoration: underline;
        }
        .muted {
            color: #999;
        }
        .filters {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 12px 16px;
            margin-bottom: 20px;
            align-items: end;
        }
        .filters label {
            display: block;
            font-size: 12px;
            color: #666;
            margin-bottom: 4px;
        }
        .filters input,
        .filters select {
            width: 100%;
            padding: 6px 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
            font-family: inherit;
            box-sizing: border-box;
            background: #fff;
        }
        .filters .actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .filters button {
            padding: 6px 14px;
            border: 1px solid #d0dcee;
            border-radius: 4px;
            background: #eef4ff;
            color: #0b5aa2;
            font-size: 14px;
            font-family: inherit;
            cursor: pointer;
        }
        .filters button:hover {
            background: #dbe8fb;
        }
        .filters a.reset {
            padding: 6px 14px;
            border: 1px solid #ddd;
            border-radius: 4px;
            background: #fff;
            color: #555;
            font-size: 14px;
            text-decoration: none;
        }
        .filters a.reset:hover {
            background: #f5f5f5;
        }
        .pagination {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            font-size: 14px;
        }
        .pagination a {
            text-decoration: none;
            color: #0b5aa2;
            padding: 6px 12px;
            border-radius: 4px;
            border: 1px solid #d0dcee;
        }
        .pagination a:hover {
            background: #eef4ff;
        }
        .pagination .disabled {
            color: #bbb;
            padding: 6px 12px;
            border: 1px solid #eee;
            border-radius: 4px;
        }
        .pagination .info {
            color: #666;
        }
    </style>
    <th:block th:replace="~{fragments/status :: styles}"></th:block>
</head>
<body>
<div class="card">
    <h1>Orders</h1>

    <form class="filters" method="get" th:action="@{/orders}" th:object="${orderFilter}">
        <div>
            <label for="status">Status</label>
            <select id="status" th:field="*{status}">
                <option value="" th:value="''">Any</option>
                <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}"></option>
            </select>
        </div>
        <div>
            <label for="customerState">Customer state</label>
            <input id="customerState" type="text" maxlength="2"
                   placeholder="e.g. SP"
                   th:field="*{customerState}">
        </div>
        <div>
            <label for="dateFrom">From</label>
            <input id="dateFrom" type="date" th:field="*{dateFrom}">
        </div>
        <div>
            <label for="dateTo">To</label>
            <input id="dateTo" type="date" th:field="*{dateTo}">
        </div>
        <div class="actions">
            <button type="submit">Apply</button>
            <a class="reset" th:href="@{/orders}">Reset</a>
        </div>
    </form>

    <table>
        <thead>
        <tr>
            <th>Order ID</th>
            <th>Status</th>
            <th>Customer</th>
            <th>Purchased at</th>
            <th>Estimated delivery</th>
            <th>Delivered to customer</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="order : ${orders.content}">
            <td>
                <a class="order-link"
                   th:href="@{/orders/{id}(id=${order.orderId})}"
                   th:text="${order.orderId}">-</a>
            </td>
            <td>
                <span th:replace="~{fragments/status :: badge(${order.orderStatus})}">STATUS</span>
            </td>
            <td th:text="${order.customer.customerCity} + ', ' + ${order.customer.customerState}">-</td>
            <td th:text="${order.orderPurchaseTimestamp}">-</td>
            <td th:text="${order.orderEstimatedDeliveryDate}">-</td>
            <td>
                <span th:if="${order.orderDeliveredCustomerDate}" th:text="${order.orderDeliveredCustomerDate}">-</span>
                <span th:unless="${order.orderDeliveredCustomerDate}" class="muted">—</span>
            </td>
        </tr>
        <tr th:if="${orders.empty}">
            <td colspan="6" class="muted" style="text-align: center;">No orders match the current filter.</td>
        </tr>
        </tbody>
    </table>

    <div class="pagination">
        <a th:if="${orders.hasPrevious()}"
           th:href="@{/orders(page=${orders.number - 1},
                          status=${orderFilter.status},
                          customerState=${orderFilter.customerState},
                          dateFrom=${orderFilter.dateFrom},
                          dateTo=${orderFilter.dateTo})}">← Prev</a>
        <span th:unless="${orders.hasPrevious()}" class="disabled">← Prev</span>

        <span class="info" th:text="'Page ' + ${orders.number + 1} + ' / ' + ${orders.totalPages}">Page 1</span>

        <a th:if="${orders.hasNext()}"
           th:href="@{/orders(page=${orders.number + 1},
                          status=${orderFilter.status},
                          customerState=${orderFilter.customerState},
                          dateFrom=${orderFilter.dateFrom},
                          dateTo=${orderFilter.dateTo})}">Next →</a>
        <span th:unless="${orders.hasNext()}" class="disabled">Next →</span>
    </div>
</div>

</body>
</html>
